[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ollamapower"
version = "0.1.0"
description = "Make the PC that runs Ollama faster by borrowing GPU/CPU from other machines on the LAN"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "cryptography>=42,<51",
    "msgpack>=1.0,<2",
    "zstandard>=0.22,<1",
    "typer>=0.12,<1",
]

classifiers = [
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Source = "https://github.com/111yoav111/OllamaPower"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
ollamapower = "ollamapower.__main__:main"

[tool.setuptools.packages.find]
include = ["ollamapower*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "BLE", "N"]
ignore = [
    "UP035",  # typing.Callable/Awaitable read fine and match OllamaGate
    "UP042",  # `str, enum.Enum` like OllamaGate (StrEnum changes str() output)
]

[tool.ruff.lint.isort]
known-first-party = ["ollamapower"]
