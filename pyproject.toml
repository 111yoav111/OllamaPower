[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ollamapower"
version = "0.1.0"
description = "Run models bigger than any one PC with Ollama, by pooling the GPUs and RAM of the PCs on your network"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "cryptography>=42,<51",
    "msgpack>=1.0,<2",
    "zstandard>=0.22,<1",
    "typer>=0.12,<1",
    "fastapi>=0.115,<1",
    "starlette>=0.40,<2",
    "uvicorn>=0.30,<1",
    "httpx>=0.27,<0.29",
    # httpcore looks for sniffio on every request; without it each lookup is a failed import (~0.35 ms).
    "sniffio>=1.3,<2",
    "psutil>=5.9,<8",
    "nvidia-ml-py>=12,<14",
    "textual>=0.80,<9",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/111yoav111/OllamaPower"
Source = "https://github.com/111yoav111/OllamaPower"
Issues = "https://github.com/111yoav111/OllamaPower/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
ollamapower = "ollamapower.__main__:main"
op = "ollamapower.__main__:main"  # the short name

[tool.setuptools.packages.find]
include = ["ollamapower*"]

[tool.setuptools.package-data]
ollamapower = ["config.example.toml", "agent.example.toml"]
"ollamapower.llamacpp" = ["pins.json"]
"ollamapower.hub" = ["catalog.json"]
"ollamapower.tui" = ["*.tcss"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "BLE", "N"]
ignore = [
    "UP035",  # typing.Callable/Awaitable read fine and match OllamaGate
    "B008",   # typer.Option(...) defaults are the Typer idiom
    "N818",   # exception names like OllamaGate (NotRunning, StreamKilled)
    "UP042",  # `str, enum.Enum` like OllamaGate (StrEnum changes str() output)
]

[tool.ruff.lint.isort]
known-first-party = ["ollamapower"]
