<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-labelledby="t d">
  <title id="t">How OllamaPower works</title>
  <desc id="d">Your apps talk to the OllamaPower hub on Ollama's usual port 11434. A model that fits this PC goes to Ollama on port 11435. A model that is too big runs in split mode: its layers are spread over helper PCs, which the hub reaches over encrypted TLS 1.3 tunnels.</desc>
  <style>
    .surface { fill: #fcfcfb; }
    .card { fill: #f4f3ef; stroke: rgba(11,11,11,0.12); stroke-width: 1; }
    .hub { fill: #eaf1fb; stroke: #2a78d6; stroke-width: 2; }
    .ink { fill: #0b0b0b; font: 600 15px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .ink2 { fill: #52514e; font: 13px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .muted { fill: #6b6a65; font: 12px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { fill: #52514e; font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .flow { fill: none; stroke: #898781; stroke-width: 2; }
    .tls { fill: none; stroke: #2a78d6; stroke-width: 2; stroke-dasharray: 6 4; }
    .head { fill: #898781; }
    .headtls { fill: #2a78d6; }
    .accent { fill: #2a78d6; font: 600 12px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .surface { fill: #1a1a19; }
      .card { fill: #242422; stroke: rgba(255,255,255,0.12); }
      .hub { fill: #1b2a3d; stroke: #3987e5; }
      .ink { fill: #f0efec; }
      .ink2, .mono { fill: #c3c2b7; }
      .muted { fill: #a3a29b; }
      .tls { stroke: #3987e5; }
      .headtls { fill: #3987e5; }
      .accent { fill: #6aa5ee; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="headtls" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <rect class="surface" x="0" y="0" width="760" height="360" rx="12"/>

  <!-- your apps -->
  <rect class="card" x="24" y="120" width="170" height="120" rx="10"/>
  <text class="ink" x="40" y="150">Your apps</text>
  <text class="ink2" x="40" y="176">Open WebUI</text>
  <text class="ink2" x="40" y="198">scripts, agents</text>
  <text class="ink2" x="40" y="220">the ollama CLI</text>
  <path class="flow" d="M194,180 L252,180" marker-end="url(#a)"/>
  <text class="muted" x="40" y="262">no changes needed</text>

  <!-- hub -->
  <rect class="hub" x="258" y="110" width="200" height="140" rx="12"/>
  <text class="ink" x="276" y="142">OllamaPower hub</text>
  <text class="mono" x="276" y="166">127.0.0.1:11434</text>
  <text class="ink2" x="276" y="192">looks exactly like Ollama</text>
  <text class="ink2" x="276" y="214">queue · planner · benchmarks</text>
  <text class="ink2" x="276" y="236">never slower than Ollama</text>

  <!-- to Ollama -->
  <path class="flow" d="M458,150 C505,150 505,78 552,78" marker-end="url(#a)"/>
  <text class="muted" x="502" y="142">fits this PC</text>
  <rect class="card" x="558" y="40" width="178" height="76" rx="10"/>
  <text class="ink" x="574" y="70">Ollama</text>
  <text class="mono" x="574" y="94">127.0.0.1:11435</text>

  <!-- to helpers -->
  <text class="accent" x="276" y="274">too big for this PC: split mode ↘</text>
  <path class="tls" d="M458,206 C505,206 505,190 552,190" marker-end="url(#b)"/>
  <path class="tls" d="M458,222 C505,222 505,290 552,290" marker-end="url(#b)"/>
  <rect class="card" x="558" y="152" width="178" height="76" rx="10"/>
  <text class="ink" x="574" y="182">Helper PC</text>
  <text class="ink2" x="574" y="206">lends its GPU + RAM</text>
  <rect class="card" x="558" y="252" width="178" height="76" rx="10"/>
  <text class="ink" x="574" y="282">Another helper</text>
  <text class="ink2" x="574" y="306">laptop, old desktop…</text>
  <text class="muted" x="276" y="294">over encrypted TLS 1.3 tunnels</text>
</svg>
